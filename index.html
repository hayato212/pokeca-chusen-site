<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#FFF4E6">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケカ抽選まとめ｜宮城・福島と全国通販の締切カレンダー</title>
<meta name="description" content="ポケモンカード・ワンピースカード・遊戯王の抽選販売と予約受付を、締切が近い順にまとめています。宮城・福島の店舗と、全国どこからでも応募できる通販が対象。今日締切の抽選と、自分がまだ応募していない分がひと目で分かります。">
<meta property="og:type" content="website">
<meta property="og:title" content="ポケカ抽選まとめ｜宮城・福島と全国通販の締切カレンダー">
<meta property="og:description" content="ポケカ・ワンピ・遊戯王の抽選と予約を締切順に。今日締切と未応募がすぐ分かります。">
<meta property="og:locale" content="ja_JP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF4E6;--paper-2:#FFE3EC;--card:#FFFFFF;--ink:#241C2B;--ink-2:#5F5570;--ink-3:#9A90A8;
  --line:#241C2B;--hot:#FF3D71;--hot-soft:#FFE0E9;--win:#00B383;--win-soft:#D6F7EC;
  --lose:#9A90A8;--field:#FFF7EF;--track:#F0E6F5;--sun:#FFC93C;--sky:#4D8DFF;--sky-soft:#E1ECFF;
  --shadow:3px 3px 0 var(--line);--shadow-sm:2px 2px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1524;--paper-2:#241A30;--card:#2A2036;--ink:#F6EEFA;--ink-2:#B9AECB;--ink-3:#877C9A;
    --line:#4A3D5E;--hot:#FF6B93;--hot-soft:#43202F;--win:#3BE0AE;--win-soft:#123A30;
    --lose:#877C9A;--field:#231B2E;--track:#352A44;--sun:#FFD45E;--sky:#7FB0FF;--sky-soft:#1E2C45;
    --shadow:3px 3px 0 #120D1A;--shadow-sm:2px 2px 0 #120D1A;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1524;--paper-2:#241A30;--card:#2A2036;--ink:#F6EEFA;--ink-2:#B9AECB;--ink-3:#877C9A;
  --line:#4A3D5E;--hot:#FF6B93;--hot-soft:#43202F;--win:#3BE0AE;--win-soft:#123A30;
  --lose:#877C9A;--field:#231B2E;--track:#352A44;--sun:#FFD45E;--sky:#7FB0FF;--sky-soft:#1E2C45;
  --shadow:3px 3px 0 #120D1A;--shadow-sm:2px 2px 0 #120D1A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 12% 8%, var(--paper-2) 0 34%, transparent 34%),
    radial-gradient(circle at 92% 22%, var(--sky-soft) 0 22%, transparent 22%),
    radial-gradient(circle at 78% 92%, var(--hot-soft) 0 26%, transparent 26%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Zen Maru Gothic","Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.num{font-family:"Baloo 2","Zen Maru Gothic",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:660px;margin:0 auto;padding:18px 15px 110px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}

/* ヘッダー */
.top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.top h1{font-size:21px;font-weight:800;margin:0;letter-spacing:.02em;
  background:var(--sun);border:2px solid var(--line);border-radius:12px;padding:3px 12px;
  box-shadow:var(--shadow-sm);transform:rotate(-1.5deg)}
.top .sub{font-size:12px;font-weight:700;color:var(--ink-2)}
.theme{margin-left:auto;background:var(--card);border:2px solid var(--line);border-radius:99px;
  color:var(--ink-2);font-size:12px;font-weight:700;padding:4px 12px;box-shadow:var(--shadow-sm)}
.theme:active{transform:translate(2px,2px);box-shadow:none}

/* いちばん近い締切 */
.hero{background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:15px 18px;
  margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:var(--hot-soft)}
.hero>*{position:relative}
.hero .lead{font-size:12px;font-weight:700;color:var(--ink-2)}
.hero .clock{font-size:46px;font-weight:800;line-height:1.05;color:var(--hot);display:block;letter-spacing:-.01em}
.hero .clock small{font-size:18px;font-weight:700;margin:0 3px 0 1px}
.hero .who{font-size:13px;margin-top:6px;color:var(--ink-2)}
.hero .who b{color:var(--ink);font-weight:800}
.hero.calm::before{background:var(--track)}
.hero.calm .clock{font-size:19px;color:var(--ink);font-weight:700;line-height:1.5}

/* タブ */
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;
  font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;box-shadow:var(--shadow-sm)}
.tab[aria-selected="true"]{background:var(--hot);color:#fff;border-color:var(--line)}
.tab em{font-style:normal;font-size:11px;font-weight:800;margin-left:4px;opacity:.85}
.tab:active{transform:translate(2px,2px);box-shadow:none}

/* エリア絞り込み */
.areas{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:4px 13px;
  font-size:12px;font-weight:700;color:var(--ink-2);box-shadow:var(--shadow-sm)}
.chip em{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--sky);color:#fff}
.chip[aria-pressed="true"] em{color:#fff;opacity:.9}
.chip:active{transform:translate(2px,2px);box-shadow:none}

/* カード */
.list{display:flex;flex-direction:column;gap:13px}
.item{background:var(--card);border:2.5px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden;transition:transform .12s ease}
.item:hover{transform:translate(-1px,-1px)}
.item.hot{box-shadow:3px 3px 0 var(--hot)}
.head{display:block;width:100%;text-align:left;background:none;border:none;padding:14px 15px 11px}
.eyebrow{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tagk{border:2px solid var(--line);border-radius:99px;padding:0 9px;font-size:11px;font-weight:700;
  color:var(--ink);background:var(--field)}
.eyebrow .tagk:first-child{background:var(--sun)}
.eyebrow .tagk:nth-child(2){background:var(--sky-soft)}
.head h3{margin:4px 0 0;font-size:17px;font-weight:800;line-height:1.4;word-break:break-word}
.head .goto{display:inline-block;font-size:12px;font-weight:800;margin-top:8px;color:var(--hot);
  border-bottom:3px solid var(--hot);padding-bottom:1px}
.head .goto.off{color:var(--ink-3);font-weight:700;border-bottom-color:var(--track)}

/* 期間バー */
.period{padding:0 15px 12px}
.bar{height:9px;background:var(--track);border:2px solid var(--line);border-radius:99px;
  overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--hot) 0 6px,#ff6b93 6px 12px)}
.bar.done i{background:var(--ink-3)}
.span{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink-3);gap:8px}
.span b{color:var(--hot);font-weight:800}
.span b.cool{color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-2);padding:10px 12px;margin:0 15px 12px;background:var(--field);
  border:2px dashed var(--line);border-radius:12px;white-space:pre-wrap;word-break:break-word}

/* ボタン類 */
.acts{display:flex;flex-wrap:wrap;gap:7px;padding:0 15px 14px}
.pill{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;
  font-size:12px;font-weight:700;line-height:1.5;box-shadow:var(--shadow-sm)}
.pill:active{transform:translate(2px,2px);box-shadow:none}
.pill.go{background:var(--hot);color:#fff}
.pill.win{background:var(--win);color:#fff}
.pill.ghost{background:none;color:var(--ink-3);border-color:var(--track);box-shadow:none}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:1px 9px;border-radius:99px;
  margin-right:7px;border:2px solid var(--line);vertical-align:2px}
.b-win{background:var(--win);color:#fff}
.b-lose{background:var(--track);color:var(--lose)}
.b-wait{background:var(--sun);color:var(--ink)}

.empty{border:3px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;
  color:var(--ink-2);font-size:13px;background:var(--card)}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:800;margin-bottom:4px}
.stamp{font-size:11px;color:var(--ink-3);text-align:center;margin-top:18px;line-height:1.7}
.foot{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.foot button{background:var(--card);border:2px solid var(--line);border-radius:99px;color:var(--ink-2);
  font-size:12px;font-weight:700;padding:5px 14px;box-shadow:var(--shadow-sm)}
.foot button:active{transform:translate(2px,2px);box-shadow:none}

/* シート */
.sheet{position:fixed;inset:0;background:rgba(36,28,43,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));
  border:2.5px solid var(--line);border-bottom:none}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:20px;border-bottom:2.5px solid var(--line);box-shadow:var(--shadow)}}
.panel h2{margin:0 0 6px;font-size:18px;font-weight:800}
.panel p.lead{font-size:13px;color:var(--ink-2);margin:0 0 14px}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:0 0 4px}
.f{margin-bottom:12px}
.row{display:flex;gap:10px}
.row .f{flex:1;min-width:0}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:2px solid var(--line);border-radius:12px;padding:9px 11px}
textarea{resize:vertical;min-height:58px;font-size:15px}
.go-row{display:flex;gap:9px;margin-top:14px}
.btn{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;
  font-size:14px;font-weight:700;box-shadow:var(--shadow-sm)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--hot);color:#fff}
.danger{background:none;border:none;color:var(--hot);font-size:12px;font-weight:700;margin-top:12px;padding:4px 0}
.backup textarea{min-height:150px;font-size:12px;font-family:ui-monospace,monospace}

/* 追加ボタン */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:20;background:var(--sun);color:var(--ink);border:2.5px solid var(--line);border-radius:99px;
  padding:13px 26px;font-size:15px;font-weight:800;box-shadow:4px 4px 0 var(--line)}
.fab:active{transform:translateX(-50%) translate(2px,2px);box-shadow:2px 2px 0 var(--line)}

/* ゲーム選択 */
.gamesel{position:relative}
.gamesel::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-52%);
  font-size:12px;color:var(--ink);pointer-events:none}
.gamesel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:800;
  color:var(--ink);background:var(--sun);border:2px solid var(--line);border-radius:99px;
  padding:4px 28px 4px 14px;box-shadow:var(--shadow-sm);cursor:pointer}
.gamesel select:focus{outline:none}

/* 今日やること：サマリー */
.summary{display:flex;gap:7px;margin:0 0 13px;flex-wrap:wrap}
.sum{display:flex;align-items:baseline;gap:5px;background:var(--card);border:2px solid var(--line);
  border-radius:14px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink-2);box-shadow:var(--shadow-sm)}
.sum b{font-size:18px;font-weight:800;color:var(--ink);font-family:"Baloo 2","Zen Maru Gothic",sans-serif}
.sum.urgent{background:var(--hot);border-color:var(--line);color:#fff}
.sum.urgent b{color:#fff}
.sum.todo{background:var(--sun);color:var(--ink)}
.sum.calm{opacity:.85}
.sum:active{transform:translate(2px,2px);box-shadow:none}

/* セクション見出し（今日やること） */
.sect{display:flex;align-items:center;gap:8px;margin:6px 0 -2px;font-size:13px;font-weight:800;color:var(--ink)}
.sect:first-child{margin-top:0}
.sect span{font-size:11px;font-weight:700;color:var(--ink-3)}
.sect::before{content:"";width:12px;height:12px;border:2px solid var(--line);border-radius:4px;background:var(--sun)}
.sect.s-today::before{background:var(--hot)}
.sect.s-soon::before{background:var(--sky)}
.sect.s-wait::before{background:var(--win)}

/* 残り時間の強調 */
.item.today{box-shadow:3px 3px 0 var(--hot);border-color:var(--hot)}
.left{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:99px;
  padding:1px 10px;font-size:12px;font-weight:800;background:var(--field);color:var(--ink)}
.left.l-now{background:var(--hot);color:#fff}
.left.l-soon{background:var(--sun);color:var(--ink)}
.left.l-calm{background:var(--field);color:var(--ink-2);font-weight:700}
.unapplied{display:inline-block;font-size:11px;font-weight:800;padding:1px 9px;border-radius:99px;
  border:2px solid var(--line);background:var(--hot);color:#fff;margin-right:7px;vertical-align:2px}

/* 応募ボタン（外部リンク） */
.open-btn{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:#fff;
  border:2px solid var(--line);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:800;
  box-shadow:var(--shadow-sm);margin-top:9px}
.open-btn.off{background:var(--track);color:var(--ink-3);box-shadow:none}
.head:active .open-btn{transform:translate(2px,2px);box-shadow:none}

/* 情報元 */
.src{font-size:11px;color:var(--ink-3);padding:0 15px 12px;margin-top:-4px;display:flex;gap:8px;flex-wrap:wrap}
.src .ofc{border:1.5px solid var(--win);color:var(--win);border-radius:99px;padding:0 7px;font-weight:700}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>抽選メモ</h1>
    <div class="gamesel">
      <select id="gameSel" aria-label="カードゲームを選ぶ">
        <option value="">すべて</option>
        <option value="ポケカ">ポケカ</option>
        <option value="ワンピース">ワンピ</option>
        <option value="遊戯王">遊戯王</option>
      </select>
    </div>
    <button class="theme" id="themeBtn">表示切替</button>
  </div>

  <div class="hero" id="hero"></div>

  <div class="summary" id="summary"></div>

  <div class="tabs" role="tablist">
    <button class="tab tab-today" role="tab" data-tab="today" aria-selected="true">今日やること<em id="cToday"></em></button>
    <button class="tab" role="tab" data-tab="open" aria-selected="false">受付中<em id="cOpen"></em></button>
    <button class="tab" role="tab" data-tab="soon" aria-selected="false">開始前<em id="cSoon"></em></button>
    <button class="tab" role="tab" data-tab="wait" aria-selected="false">結果待ち<em id="cWait"></em></button>
    <button class="tab" role="tab" data-tab="done" aria-selected="false">結果<em id="cDone"></em></button>
  </div>

  <div class="areas" id="areas">
    <button class="chip" data-area="" aria-pressed="true">すべて<em id="aAll"></em></button>
    <button class="chip" data-area="local" aria-pressed="false">宮城・福島<em id="aLocal"></em></button>
    <button class="chip" data-area="全国" aria-pressed="false">全国・通販<em id="aWide"></em></button>
  </div>

  <div class="list" id="list"></div>

  <div class="stamp" id="stamp"></div>
  <div class="foot">
    <button id="showEndedBtn">終了した未応募も見る</button>
    <button id="backupBtn">バックアップ</button>
  </div>
</div>

<button class="fab" id="addBtn">＋ 自分で追加</button>

<!-- 応募確認 -->
<div class="sheet" id="askSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">応募できましたか？</h2>
    <p class="lead" id="askWho"></p>
    <div class="go-row">
      <button class="btn" id="askNo">まだ</button>
      <button class="btn primary" id="askYes">応募した</button>
    </div>
  </div>
</div>

<!-- 追加・編集 -->
<div class="sheet" id="editSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <h2 id="edTitle">自分で追加</h2>
    <p class="lead">一覧にない店舗や、店頭抽選の分はここから。</p>
    <div class="f"><label for="fShop">店舗・サイト</label><input id="fShop" placeholder="例：カードラッシュ郡山店"></div>
    <div class="f"><label for="fItem">対象商品</label><input id="fItem" placeholder="例：30th CELEBRATION BOX"></div>
    <div class="row">
      <div class="f"><label for="fStart">受付開始</label><input id="fStart" type="datetime-local"></div>
      <div class="f"><label for="fEnd">受付終了</label><input id="fEnd" type="datetime-local"></div>
    </div>
    <div class="f"><label for="fAnn">当選発表</label><input id="fAnn" type="date"></div>
    <div class="f"><label for="fUrl">応募ページのURL</label><input id="fUrl" type="url" inputmode="url" placeholder="https://"></div>
    <div class="f"><label for="fNote">メモ</label><textarea id="fNote" placeholder="会員条件、使ったアカウント、購入期限など"></textarea></div>
    <div class="go-row">
      <button class="btn" id="edCancel">やめる</button>
      <button class="btn primary" id="edSave">保存する</button>
    </div>
    <button class="danger" id="edDelete" hidden>これを削除する</button>
  </div>
</div>

<!-- バックアップ -->
<div class="sheet" id="bkSheet" hidden>
  <div class="panel backup" role="dialog" aria-modal="true" aria-labelledby="bkTitle">
    <h2 id="bkTitle">バックアップ</h2>
    <p class="lead">応募状況と自分で追加した分は、この端末のブラウザにだけ保存されています。別の端末で使うときは下をコピーして貼り直してください。</p>
    <textarea id="bkArea" spellcheck="false"></textarea>
    <div class="go-row">
      <button class="btn" id="bkCopy">コピー</button>
      <button class="btn" id="bkRestore">貼り付けた内容で復元</button>
    </div>
    <div class="go-row" style="margin-top:9px"><button class="btn" id="bkClose">閉じる</button></div>
  </div>
</div>

<script>

  url:'',note:'スターカード会員限定。購入実績による条件あり。店頭ポスターのQRコードから応募。営業時間は店舗ごとに違う。'},
 {id:'nojima-secret',shop:'ノジマオンライン',area:'全国',item:'シークレット販売会（ポケカ新弾ほか）',

  note:'会員IDが必要。複数IDでのエントリーは無効。終了日は告知されていない。'}
];
var STAMP='2026年9月16日時点で受付中だった商品の抽選販売';

var SKEY='chusen.state.v2', CKEY='chusen.custom.v2', OLD='chusen.entries.v1', TKEY='chusen.theme', AKEY='chusen.area.v1', GKEY='chusen.game.v1';
var state={}, custom=[], tab='today', editing=null, pending=null, showEnded=false;
var area=''; /* '' = すべて / 'local' = 宮城・福島 / '全国' */
var game=''; /* '' = すべて / 'ポケカ' / 'ワンピース' / '遊戯王' */
var $=function(i){return document.getElementById(i)};

/* ---- storage ---- */
function load(){
  try{ state=JSON.parse(localStorage.getItem(SKEY)||'{}')||{} }catch(e){ state={} }
  try{ custom=JSON.parse(localStorage.getItem(CKEY)||'[]')||[] }catch(e){ custom=[] }
  try{ area=localStorage.getItem(AKEY)||'' }catch(e){ area='' }
  try{ game=localStorage.getItem(GKEY)||'' }catch(e){ game='' }
  if(!Array.isArray(custom)) custom=[];
  /* 前バージョンのデータを引き継ぐ */
  try{
    var old=JSON.parse(localStorage.getItem(OLD)||'null');
    if(Array.isArray(old)&&old.length&&!custom.length){
      old.forEach(function(e){
        custom.push({id:e.id,shop:e.shop||'',item:e.name||'',kind:'',start:'',end:e.deadline||'',
          announce:e.announce||'',url:e.url||'',note:e.memo||'',mine:true});
        state[e.id]={status:e.status==='todo'?'none':e.status};
      });
      saveCustom(); saveState();
    }
  }catch(e){}
}
function saveState(){ try{ localStorage.setItem(SKEY,JSON.stringify(state)) }catch(e){} }
function saveCustom(){ try{ localStorage.setItem(CKEY,JSON.stringify(custom)) }catch(e){} }

/* ---- helpers ---- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dt(s){ if(!s) return null; var d=new Date(s); return isNaN(d)?null:d }
function md(d){ return (d.getMonth()+1)+'/'+d.getDate() }
function wd(d){ return '日月火水木金土'.charAt(d.getDay()) }
function hm(d){ var m=d.getMinutes(); return d.getHours()+':'+(m<10?'0':'')+m }
function stamp(d){ return md(d)+'('+wd(d)+') '+hm(d) }
function pad(n){ return (n<10?'0':'')+n }
function st(id){ return (state[id]&&state[id].status)||'none' }
function setSt(id,v){ state[id]=state[id]||{}; state[id].status=v; state[id].at=Date.now(); saveState() }

function all(){ return CATALOG.concat(custom) }

/* どのカードゲームか。data.json に game があればそれを使い、無い分（手入力・自分で追加）は文面から判定する */
function gameOf(e){
  if(e.game) return e.game;
  var t=(e.item||'')+' '+(e.shop||'')+' '+(e.note||'');
  if(/ワンピ|ONE PIECE|OP-?\d{2}|EB-?\d{2}/i.test(t)) return 'ワンピース';
  if(/遊戯王|遊☆戯☆王|yu-?gi-?oh|OCG|ラッシュデュエル/i.test(t)) return '遊戯王';
  if(/ポケ|pok[eé]mon|CELEBRATION|メガ|ストームエメラルダ|スタートデッキ/i.test(t)) return 'ポケカ';
  return '';
}
/* 選んだゲームで絞る。判定できないものはどの選択でも出す */
function inGame(e,g){ if(!g) return true; var v=gameOf(e); return !v||v===g }

/* エリアの絞り込み。エリアが判らないもの（自分で追加した分など）はどの絞り込みでも出す */
function inArea(e,a){
  if(!a||!e.area) return true;
  return a==='local' ? (e.area==='宮城'||e.area==='福島') : e.area===a;
}
function visible(){ return all().filter(function(e){ return inArea(e,area)&&inGame(e,game) }) }

function phase(e,now){
  var s=dt(e.start), en=dt(e.end), v=st(e.id);
  if(v==='won'||v==='lost') return 'done';
  if(v==='applied') return 'wait';
  if(s&&s>now) return 'soon';
  if(en&&en<now) return 'ended';
  return 'open';
}

/* 今日/明日/3日以内 の判定用。日付だけを見る */
function dayStart(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime() }
function daysApart(target,now){ return Math.round((dayStart(target)-dayStart(now))/86400000) }

/* 締切の近さ。today / tomorrow / soon3（3日以内） / later / null */
function endBucket(e,now){
  var en=dt(e.end); if(!en||en<now) return null;
  var d=daysApart(en,now);
  return d<=0?'today' : d===1?'tomorrow' : d<=3?'soon3' : 'later';
}

/* 残り時間の文言 */
function leftText(en,now){
  var r=remain(en,now);
  if(!r) return null;
  if(r.days>=1) return 'あと'+r.days+'日'+(r.hours?r.hours+'時間':'');
  if(r.totalHours>=1) return 'あと'+r.totalHours+'時間'+(r.mins?r.mins+'分':'');
  return 'あと'+r.mins+'分';
}

function remain(end,now){
  var ms=end-now; if(ms<=0) return null;
  var mins=Math.floor(ms/60000), hours=Math.floor(mins/60);
  return {days:Math.floor(hours/24),hours:hours%24,mins:mins%60,totalHours:hours};
}

/* 今日やること：今日〜3日以内に締切の未応募 / 今日開始 / 今日以前が発表日の結果待ち */
function todayReason(e,now){
  var p=phase(e,now), v=st(e.id);
  if(p==='open'&&v==='none'){
    var b=endBucket(e,now);
    if(b==='today') return 'today';
    if(b==='tomorrow') return 'tomorrow';
    if(b==='soon3') return 'soon3';
  }
  if(p==='soon'){ var s2=dt(e.start); if(s2&&daysApart(s2,now)===0) return 'start'; }
  if(p==='wait'){ var an=dt(e.announce); if(an&&daysApart(an,now)<=0) return 'result'; }
  return null;
}

/* ---- hero ---- */
function renderHero(){
  var now=new Date(), best=null,bestD=null;
  visible().forEach(function(e){
    if(phase(e,now)!=='open') return;
    var d=dt(e.end); if(!d||d<=now) return;
    if(!bestD||d<bestD){bestD=d;best=e}
  });
  var h=$('hero');
  if(!best){
    var w=visible().filter(function(e){return phase(e,new Date())==='wait'}).length;
    h.className='hero calm';
    h.innerHTML='<div class="lead">次の締切</div><span class="clock">'+
      (w? '締切待ちはなし。'+w+'件が結果待ちです。':'いま応募できる抽選はありません。')+'</span>';
    return;
  }
  var r=remain(bestD,now), big;
  if(r.days>=1) big='<span class="num">'+r.days+'</span><small>日</small><span class="num">'+r.hours+'</span><small>時間</small>';
  else if(r.totalHours>=1) big='<span class="num">'+r.hours+'</span><small>時間</small><span class="num">'+r.mins+'</span><small>分</small>';
  else big='<span class="num">'+r.mins+'</span><small>分</small>';
  h.className='hero';
  h.innerHTML='<div class="lead">次の締切まで</div><span class="clock">'+big+'</span>'+
    '<div class="who"><b>'+esc(best.shop)+'</b>　'+esc(best.item)+'<br>'+stamp(bestD)+'まで</div>';
}

/* ---- サマリー ---- */
function renderSummary(){
  var now=new Date(), n={today:0,tomorrow:0,soon3:0,open:0,soon:0,wait:0,todo:0,result:0};
  visible().forEach(function(e){
    var p=phase(e,now), v=st(e.id), b=endBucket(e,now);
    if(p==='open'){
      n.open++;
      if(v==='none'){ n.todo++; if(b==='today') n.today++; else if(b==='tomorrow') n.tomorrow++; else if(b==='soon3') n.soon3++; }
    }
    if(p==='soon') n.soon++;
    if(p==='wait'){ n.wait++; var an=dt(e.announce); if(an&&daysApart(an,now)<=0) n.result++; }
  });
  var out=[];
  if(n.today) out.push('<button class="sum urgent" data-jump="today"><b>'+n.today+'</b>件 今日締切</button>');
  if(n.tomorrow) out.push('<button class="sum todo" data-jump="today"><b>'+n.tomorrow+'</b>件 明日締切</button>');
  if(n.soon3) out.push('<button class="sum" data-jump="today"><b>'+n.soon3+'</b>件 3日以内</button>');
  if(n.result) out.push('<button class="sum todo" data-jump="wait"><b>'+n.result+'</b>件 結果確認</button>');
  out.push('<button class="sum'+(n.todo&&!n.today&&!n.tomorrow?' todo':'')+'" data-jump="open"><b>'+n.todo+'</b>件 未応募</button>');
  if(n.wait) out.push('<button class="sum calm" data-jump="wait"><b>'+n.wait+'</b>件 結果待ち</button>');
  if(n.soon) out.push('<button class="sum calm" data-jump="soon"><b>'+n.soon+'</b>件 開始前</button>');
  $('summary').innerHTML=out.join('');
}

/* 条件タグ。今あるデータ（エリア・方式・配送・note の「条件:」）だけから作る */
function tagsOf(e){
  var t=[];
  var g=gameOf(e); if(g&&!game) t.push(g);
  if(e.kind) t.push(e.kind);
  if(e.area) t.push(e.area);
  if(e.ships===true) t.push('配送あり');
  if(e.ships===false) t.push('店頭受取');
  var m=/条件[:：]\s*([^\s]+)/.exec(e.note||'');
  if(m) m[1].split(/[\/・]/).forEach(function(x){ if(x&&t.indexOf(x)<0) t.push(x) });
  if(e.mine) t.push('自分で追加');
  return t;
}

/* ---- card ---- */
function card(e){
  var now=new Date(), p=phase(e,now), s=dt(e.start), en=dt(e.end), an=dt(e.announce), v=st(e.id);
  var hot=false, isToday=false, spanL='', spanR='', pct=0, barDone=false;

  if(en){
    var r=remain(en,now), b=endBucket(e,now);
    if(!r){ spanR='<b class="cool">受付終了</b>'; pct=100; barDone=true; }
    else if(s&&s>now){
      var rs=remain(s,now);
      spanR='<b class="cool">開始まであと'+(rs.days>=1?rs.days+'日':rs.totalHours+'時間')+'</b>'; pct=0;
    }else{
      hot = r.totalHours<72; isToday = b==='today';
      var cls = b==='today' ? 'l-now' : (b==='tomorrow'||b==='soon3') ? 'l-soon' : 'l-calm';
      var txt = b==='today' ? (r.totalHours<1 ? 'まもなく締切・'+leftText(en,now) : '本日'+hm(en)+'締切')
              : b==='tomorrow' ? '明日'+hm(en)+'締切・'+leftText(en,now)
              : leftText(en,now);
      spanR='<span class="left '+cls+'">'+txt+'</span>';
      if(s) pct=Math.max(2,Math.min(100,(now-s)/(en-s)*100)); else pct=50;
    }
    spanL=(s?stamp(s):'？')+'　→　'+stamp(en);
  }else{
    spanL=(s?stamp(s)+' 〜':'期間未定'); spanR='<b class="cool">終了日の告知なし</b>'; pct=40;
  }

  /* 応募の状態 */
  var badge='';
  if(v==='applied'){
    var waitTxt='応募ずみ';
    if(an){ var d=daysApart(an,now); waitTxt = d>0 ? '結果発表まであと'+d+'日' : d===0 ? '本日 結果発表' : '結果を確認'; }
    badge='<span class="badge b-wait">'+waitTxt+'</span>';
  }
  if(v==='won') badge='<span class="badge b-win">当選</span>';
  if(v==='lost') badge='<span class="badge b-lose">落選</span>';
  if(v==='none'&&p==='open'&&(isToday||endBucket(e,now)==='tomorrow')) badge='<span class="unapplied">未応募</span>'+badge;

  /* 条件タグ */
  var meta=tagsOf(e).map(function(t){ return '<span class="tagk">'+esc(t)+'</span>' }).join('');
  if(an) meta+='<span>発表 '+md(an)+'('+wd(an)+')</span>';

  var btn = e.url
    ? '<span class="open-btn">公式サイトで応募 ↗</span>'
    : '<span class="open-btn off">'+(e.kind==='店頭抽選'?'店頭で応募（リンクなし）':'応募ページの記載なし')+'</span>';

  var headInner='<div class="eyebrow">'+meta+'</div>'+
    '<h3>'+badge+esc(e.shop)+'</h3>'+
    '<div style="font-size:13px;color:var(--ink-2);margin-top:1px">'+esc(e.item)+'</div>'+btn;

  var head = e.url
    ? '<button class="head" data-act="open" data-id="'+e.id+'">'+headInner+'</button>'
    : '<div class="head">'+headInner+'</div>';

  var acts='';
  if(p==='open'||p==='soon'||p==='ended'){
    acts+='<button class="pill go" data-act="applied" data-id="'+e.id+'">応募ずみにする</button>';
  }else if(p==='wait'){
    acts+='<button class="pill win" data-act="won" data-id="'+e.id+'">当選</button>'+
          '<button class="pill" data-act="lost" data-id="'+e.id+'">落選</button>'+
          '<button class="pill ghost" data-act="none" data-id="'+e.id+'">取り消す</button>';
  }else{
    acts+='<button class="pill ghost" data-act="applied" data-id="'+e.id+'">結果待ちに戻す</button>';
  }
  if(e.mine) acts+='<button class="pill ghost" data-act="edit" data-id="'+e.id+'">編集</button>';

  /* 情報元（データにある時だけ） */
  var src='';
  if(e.source||e.checkedAt){
    var c=dt(e.checkedAt);
    src='<div class="src">'+(e.official?'<span class="ofc">公式</span>':'')+
      (e.source?'<span>情報元: '+esc(e.source)+'</span>':'')+
      (c?'<span>'+md(c)+'('+wd(c)+') '+hm(c)+' 確認</span>':'')+'</div>';
  }

  return '<div class="item'+(isToday&&p==='open'?' today':(hot&&p==='open'?' hot':''))+'">'+head+
    '<div class="period"><div class="bar'+(barDone?' done':'')+'"><i style="width:'+pct+'%"></i></div>'+
    '<div class="span"><span>'+spanL+'</span>'+spanR+'</div></div>'+
    (e.note?'<div class="note">'+esc(e.note)+'</div>':'')+src+
    '<div class="acts">'+acts+'</div></div>';
}

function listFor(t){
  var now=new Date();
  if(t==='today'){
    var order={today:0,tomorrow:1,soon3:2,start:3,result:4};
    return visible().filter(function(e){ return !!todayReason(e,now) })
      .sort(function(a,b){
        var d=order[todayReason(a,now)]-order[todayReason(b,now)];
        if(d) return d;
        var x=dt(a.end)||dt(a.start)||dt(a.announce), y=dt(b.end)||dt(b.start)||dt(b.announce);
        if(!x) return 1; if(!y) return -1; return x-y;
      });
  }
  var arr=visible().filter(function(e){
    var p=phase(e,now);
    if(t==='open') return p==='open'||(showEnded&&p==='ended');
    return p===t;
  });
  arr.sort(function(a,b){
    var x=dt(t==='soon'?a.start:a.end), y=dt(t==='soon'?b.start:b.end);
    if(!x) return 1; if(!y) return -1; return x-y;
  });
  return arr;
}

function renderList(){
  var arr=listFor(tab), el=$('list');
  if(tab==='today'){
    if(!arr.length){
      el.innerHTML='<div class="empty"><b>今日やることはありません</b>締切が近い未応募と、今日の結果発表がここに出ます。</div>';
      return;
    }
    var now=new Date(), labels={
      today:['今日締切','s-today'], tomorrow:['明日締切','s-soon'], soon3:['3日以内に締切','s-soon'],
      start:['今日 受付開始','s-soon'], result:['結果を確認','s-wait']
    }, cur='', html='';
    arr.forEach(function(e){
      var k=todayReason(e,now);
      if(k!==cur){ cur=k; html+='<div class="sect '+labels[k][1]+'">'+labels[k][0]+
        '<span>'+arr.filter(function(x){return todayReason(x,now)===k}).length+'件</span></div>'; }
      html+=card(e);
    });
    el.innerHTML=html;
    return;
  }
  if(!arr.length){
    var m={open:['受付中の抽選はありません','締切が過ぎた未応募分は自動で隠れています。'],
           soon:['開始待ちはありません','これから始まる抽選が入るとここに出ます。'],
           wait:['結果待ちはありません','応募したら「応募ずみにする」を押してください。'],
           done:['まだ結果は出ていません','当落がついた分はここに残ります。']}[tab];
    el.innerHTML='<div class="empty"><b>'+m[0]+'</b>'+m[1]+'</div>';
    return;
  }
  el.innerHTML=arr.map(card).join('');
}

function counts(){
  var now=new Date(), c={open:0,soon:0,wait:0,done:0}, a={'':0,local:0,'全国':0};
  visible().forEach(function(e){ var p=phase(e,now); if(c[p]!==undefined) c[p]++ });
  var today=visible().filter(function(e){ return !!todayReason(e,now) }).length;
  $('cToday').textContent=today||'';
  all().forEach(function(e){
    if(phase(e,now)!=='open'||!inGame(e,game)) return;
    ['','local','全国'].forEach(function(k){ if(inArea(e,k)) a[k]++ });
  });
  /* ドロップダウンに件数を出す（受付中の数） */
  var gc={'':0,'ポケカ':0,'ワンピース':0,'遊戯王':0};
  all().forEach(function(e){
    if(phase(e,now)!=='open'||!inArea(e,area)) return;
    gc['']++; var v=gameOf(e); if(gc[v]!==undefined) gc[v]++;
  });
  Array.prototype.forEach.call($('gameSel').options,function(o){
    var base={'':'すべて','ポケカ':'ポケカ','ワンピース':'ワンピ','遊戯王':'遊戯王'}[o.value];
    o.textContent=base+'（'+(gc[o.value]||0)+'）';
  });
  $('gameSel').value=game;
  $('cOpen').textContent=c.open||''; $('cSoon').textContent=c.soon||'';
  $('cWait').textContent=c.wait||''; $('cDone').textContent=c.done||'';
  $('aAll').textContent=a['']||''; $('aLocal').textContent=a.local||''; $('aWide').textContent=a['全国']||'';
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){
    b.setAttribute('aria-pressed', b.dataset.area===area?'true':'false') });
}

function render(){ renderHero(); renderSummary(); counts(); renderList();
  $('stamp').textContent=STAMP+'。内容は変わることがあるので、応募前に必ず公式ページで確認してください。';
  $('showEndedBtn').textContent=showEnded?'終了した未応募を隠す':'終了した未応募も見る';
}

/* ---- actions ---- */
$('list').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b) return;
  var id=b.dataset.id, act=b.dataset.act;
  var e=all().filter(function(x){return x.id===id})[0]; if(!e) return;
  if(act==='open'){
    pending=id;
    try{ window.open(e.url,'_blank','noopener') }catch(err){}
    return;
  }
  if(act==='edit'){ openEdit(e); return; }
  setSt(id,act); render();
});

/* 戻ってきたら確認 */
document.addEventListener('visibilitychange',function(){
  if(document.hidden) return;
  if(pending && st(pending)==='none'){
    var e=all().filter(function(x){return x.id===pending})[0];
    if(e){ $('askWho').textContent=e.shop+'／'+e.item; $('askSheet').hidden=false; return; }
  }
  pending=null; render();
});
$('askYes').onclick=function(){ if(pending) setSt(pending,'applied'); pending=null; $('askSheet').hidden=true; render() };
$('askNo').onclick=function(){ pending=null; $('askSheet').hidden=true; render() };

/* ---- tabs ---- */
function syncTabs(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.setAttribute('aria-selected',t.dataset.tab===tab?'true':'false')})
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.onclick=function(){ tab=t.dataset.tab; syncTabs(); renderList() }});
$('gameSel').onchange=function(){
  game=$('gameSel').value;
  try{ localStorage.setItem(GKEY,game) }catch(e){}
  render();
};
$('areas').addEventListener('click',function(ev){
  var b=ev.target.closest('.chip'); if(!b) return;
  area=b.dataset.area; try{ localStorage.setItem(AKEY,area) }catch(e){}
  render();
});
$('summary').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-jump]'); if(!b) return;
  tab=b.dataset.jump; syncTabs(); renderList();
  window.scrollTo({top:0,behavior:'smooth'});
});
$('showEndedBtn').onclick=function(){ showEnded=!showEnded; tab='open'; syncTabs(); render() };

/* ---- add / edit ---- */
function openEdit(e){
  editing=e||null;
  $('edTitle').textContent=e?'編集':'自分で追加';
  $('fShop').value=e?e.shop:''; $('fItem').value=e?e.item:'';
  $('fStart').value=e?e.start:''; $('fEnd').value=e?e.end:'';
  $('fAnn').value=e?e.announce:''; $('fUrl').value=e?e.url:''; $('fNote').value=e?e.note:'';
  $('edDelete').hidden=!e; $('editSheet').hidden=false;
  setTimeout(function(){ $('fShop').focus() },30);
}
$('addBtn').onclick=function(){ openEdit(null) };
$('edCancel').onclick=function(){ $('editSheet').hidden=true; editing=null };
$('editSheet').onclick=function(ev){ if(ev.target===$('editSheet')){ $('editSheet').hidden=true; editing=null } };
$('edSave').onclick=function(){
  var shop=$('fShop').value.trim(), item=$('fItem').value.trim();
  if(!shop&&!item){ $('fShop').focus(); return }
  var v={shop:shop,item:item,kind:'',start:$('fStart').value,end:$('fEnd').value,
    announce:$('fAnn').value,url:$('fUrl').value.trim(),note:$('fNote').value.trim(),mine:true};
  if(editing){ for(var k in v) editing[k]=v[k] }
  else{ v.id='m'+Date.now()+Math.floor(Math.random()*999); custom.push(v); tab='open'; syncTabs() }
  saveCustom(); $('editSheet').hidden=true; editing=null; render();
};
$('edDelete').onclick=function(){
  if(!editing) return;
  custom=custom.filter(function(x){return x.id!==editing.id});
  delete state[editing.id]; saveCustom(); saveState();
  $('editSheet').hidden=true; editing=null; render();
};

/* ---- backup ---- */
$('backupBtn').onclick=function(){ $('bkArea').value=JSON.stringify({state:state,custom:custom}); $('bkSheet').hidden=false };
$('bkClose').onclick=function(){ $('bkSheet').hidden=true };
$('bkSheet').onclick=function(ev){ if(ev.target===$('bkSheet')) $('bkSheet').hidden=true };
$('bkCopy').onclick=function(){
  var a=$('bkArea'); a.select();
  try{
    if(navigator.clipboard) navigator.clipboard.writeText(a.value); else document.execCommand('copy');
    $('bkCopy').textContent='コピーしました'; setTimeout(function(){ $('bkCopy').textContent='コピー' },1600);
  }catch(e){ $('bkCopy').textContent='手動で選択してコピーを' }
};
$('bkRestore').onclick=function(){
  try{
    var o=JSON.parse($('bkArea').value);
    if(!o||typeof o!=='object') throw 0;
    state=o.state||{}; custom=Array.isArray(o.custom)?o.custom:[];
    saveState(); saveCustom(); $('bkSheet').hidden=true; render();
  }catch(e){
    $('bkRestore').textContent='読み込めませんでした';
    setTimeout(function(){ $('bkRestore').textContent='貼り付けた内容で復元' },2400);
  }
};

/* ---- theme ---- */
try{ var t=localStorage.getItem(TKEY); if(t) document.documentElement.setAttribute('data-theme',t) }catch(e){}
$('themeBtn').onclick=function(){
  var cur=document.documentElement.getAttribute('data-theme'), next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem(TKEY,next) }catch(e){}
};
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){ $('editSheet').hidden=true; $('bkSheet').hidden=true; $('askSheet').hidden=true; editing=null; pending=null }
});

/* ---- data.json を読みにいく（同じフォルダに置く） ---- */
function pull(){
  if(location.protocol==='file:') return; /* file:// では読めないので内蔵データを使う */
  fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw 0; return r.json();
  }).then(function(j){
    if(j&&Array.isArray(j.items)){ CATALOG=j.items; if(j.stamp) STAMP=j.stamp; render(); }
  }).catch(function(){});
}

load(); syncTabs(); render(); pull();
setInterval(function(){ renderHero(); renderSummary(); if(tab==='open'||tab==='today') renderList() },30000);
setInterval(pull,600000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) pull() });
})();
</script>
</body>
</html>
